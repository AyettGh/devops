name: build push on github packages
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build_push_github_packages:
    runs-on: ubuntu_latest
    steps:
      - name: checkout the repo
        uses: actions/checkout@v5
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/ayett327/devops
          tags: |
            type=ref,event=branch #seance3
            type=ref,event=pr  #feature-x  exp: pr-2 2 fois sar el pull request
            type=semver,pattern={{version}} #1
            type=semver,pattern={{major}}.{{minor}} #1.2.4 el minor:4 et major:1
      - name: set up Qemu
        uses: docker/setup-qemu-action@v2
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to GHCR #(registry og github)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{secrets.GHCR_TOKEN}}
      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags}} #it will come from step from meta with an output the tag


