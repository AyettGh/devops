services:
  keycloak:
    image: quay.io/keycloak/keycloak:18.0.2
    #restart: always
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      DB_USER: postgres
      DB_PASSWORD: post2222sql
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_DB: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: post2222sql
    ports:
      - 8087:8080
    command: start-dev
    depends_on:
      - postgres
    networks:
      - keycloakpostgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: post2222sql
    ports:
      - 5432:5432
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloakpostgres

volumes:
  keycloak-postgres-data:

networks:
  keycloakpostgres:
